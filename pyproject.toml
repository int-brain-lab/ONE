[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ONE-api"
dynamic = ["version", "readme"]
description = "Open Neurophysiology Environment"
authors = [
    {name = "IBL Staff"},
]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ruff",
    # waiting for numba to support 2.4",
    "numpy>=1.18, <2.4",
    # pandas 3 regex on strings issue <one.tests.test_one.TestONECache testMethod=test_filter>
    "pandas>=1.5.0",
    "tqdm>=4.32.1",
    "requests>=2.22.0",
    "iblutil>=1.14.0",
    "packaging",
    "boto3",
    "pyyaml"
]

[project.optional-dependencies]
docs = [
    "sphinx_rtd_theme",
    "nbsphinx",
    "nbsphinx-link",
    "myst_parser",
    "sphinx>=3.1.2",
    "sphinx-copybutton",
    "sphinx-gallery",
    "ipyevents",
    "jupyter",
    # Required to execute the data_sharing notebook
    "matplotlib",
    "globus_sdk"  # For Globus module
]
globus = ["globus_sdk>=4.4.0"]

[project.urls]
Homepage = "https://github.com/int-brain-lab/ONE"
Documentation = "https://one.internationalbrainlab.org"
Repository = "https://github.com/int-brain-lab/ONE.git"
Issues = "https://github.com/int-brain-lab/ONE/issues"
Changelog = "https://github.com/int-brain-lab/ONE/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "one.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["one*"]
exclude = ["one.tests*"]

[tool.ruff]
line-length = 99
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["D", "E", "F", "W"]
ignore = ["E266", "D401", "D105", "D107", "D102", "D417", "D101", "D404", "D100", "D301", "D103", "D403"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
