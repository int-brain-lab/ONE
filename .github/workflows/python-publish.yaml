# Reference for this action:
#   https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: >-
      Publish Python distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ONE-api
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      # GitHub recommends pinning 3rd party actions to a commit SHA.
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  update-citation:
    name: Update CITATION.cff
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Check tag is a full major.minor.patch release
      id: check
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "is_release=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "Skipping CITATION.cff update for non-release tag: ${GITHUB_REF_NAME}"
        fi
    - uses: actions/checkout@v3
      if: steps.check.outputs.is_release == 'true'
      with:
        ref: main
    - name: Bump version and date-released in CITATION.cff
      if: steps.check.outputs.is_release == 'true'
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        DATE=$(date -u +%Y-%m-%d)
        sed -i "s/^version: .*/version: ${VERSION}/" CITATION.cff
        sed -i "s/^date-released: .*/date-released: ${DATE}/" CITATION.cff
    - name: Commit and push
      if: steps.check.outputs.is_release == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add CITATION.cff
        git diff --cached --quiet || git commit -m "Update CITATION.cff for ${GITHUB_REF_NAME}"
        git push origin HEAD:main
